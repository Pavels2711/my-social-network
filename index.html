<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>Лента</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { background:#F5F5F7; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    color:#1D1D1F; -webkit-tap-highlight-color: transparent;
    padding-bottom: env(safe-area-inset-bottom);
  }
  input, textarea, button { font-family: inherit; }
  input, textarea { font-size:16px; } /* без авто-зума на iOS */
  .header-blur {
    background: rgba(245,245,247,.72);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: .5px solid rgba(60,60,67,.18);
    padding-top: env(safe-area-inset-top);
  }
  .card { background:#fff; border:.5px solid rgba(60,60,67,.14); box-shadow:0 1px 2px rgba(0,0,0,.03); }
  .press:active { transform: scale(.96); opacity:.8; }
  .press { transition: transform .12s ease, opacity .12s ease; }
  .heart path { transition: fill .25s ease, stroke .25s ease; }
  .heart-pop { animation: pop .3s ease; }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.3)} 100%{transform:scale(1)} }
  .fade-in { animation: fade .3s ease; }
  @keyframes fade { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
  .swatch { transition: transform .15s ease, box-shadow .15s ease; }
  .swatch.sel { transform: scale(1.12); box-shadow: 0 0 0 3px #fff, 0 0 0 5px #007AFF; }
  textarea { resize:none; outline:none; }
  input:focus, textarea:focus { outline:none; }
</style>
</head>
<body class="min-h-screen">

<!-- Экран входа / регистрации -->
<div id="auth" class="hidden min-h-screen flex items-center justify-center px-5 py-10">
  <div class="w-full max-w-sm fade-in">
    <h1 class="text-[34px] font-bold tracking-tight text-center">Добро пожаловать</h1>
    <p class="text-center text-[17px] text-neutral-500 mt-2 mb-8">Создайте аккаунт, чтобы начать</p>

    <div id="existing" class="hidden mb-6">
      <p class="text-[13px] uppercase tracking-wide text-neutral-500 px-2 mb-2">Войти как</p>
      <div id="existingList" class="card rounded-2xl overflow-hidden"></div>
      <p class="text-[13px] uppercase tracking-wide text-neutral-500 px-2 mt-6 mb-2">Или создать новый</p>
    </div>

    <div class="card rounded-2xl p-5">
      <div class="flex justify-center mb-5">
        <div id="previewAvatar" class="w-20 h-20 rounded-full flex items-center justify-center text-white text-[30px] font-semibold" style="background:#007AFF">?</div>
      </div>
      <label class="block text-[13px] text-neutral-500 mb-1.5 px-1">Имя (никнейм)</label>
      <input id="nameInput" maxlength="20" autocomplete="off" placeholder="Например, Алекс"
        class="w-full bg-[#F5F5F7] rounded-xl px-4 py-3.5 text-[17px] mb-4">
      <label class="block text-[13px] text-neutral-500 mb-1.5 px-1">Инициалы (1–2 буквы, необязательно)</label>
      <input id="initialsInput" maxlength="2" autocomplete="off" placeholder="Авто"
        class="w-full bg-[#F5F5F7] rounded-xl px-4 py-3.5 text-[17px] mb-4 uppercase">
      <label class="block text-[13px] text-neutral-500 mb-2 px-1">Цвет аватарки</label>
      <div id="swatches" class="flex justify-between px-1 mb-6"></div>
      <button id="createBtn" class="press w-full bg-[#007AFF] text-white text-[17px] font-semibold rounded-xl py-3.5 opacity-50">Создать аккаунт</button>
    </div>
  </div>
</div>

<!-- Приложение -->
<div id="app" class="hidden">
  <header class="header-blur sticky top-0 z-30">
    <div class="max-w-xl mx-auto h-14 px-4 flex items-center justify-between">
      <h1 class="text-[22px] font-bold tracking-tight">Лента</h1>
      <div class="flex items-center gap-2">
        <div id="meBadge" class="flex items-center gap-2 pl-1 pr-3 py-1 rounded-full bg-white/70 border border-black/5">
          <div id="meAvatar" class="w-7 h-7 rounded-full text-white text-[12px] font-semibold flex items-center justify-center"></div>
          <span id="meName" class="text-[15px] font-medium max-w-[110px] truncate"></span>
        </div>
        <button id="logoutBtn" aria-label="Выйти" class="press w-10 h-10 rounded-full bg-white/70 border border-black/5 flex items-center justify-center text-[#007AFF]">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 pt-5 pb-16">
    <!-- Форма публикации -->
    <div class="card rounded-2xl p-4 mb-5">
      <div class="flex gap-3">
        <div id="composeAvatar" class="w-10 h-10 shrink-0 rounded-full text-white text-[15px] font-semibold flex items-center justify-center"></div>
        <textarea id="postInput" rows="2" maxlength="500" placeholder="Что нового?"
          class="flex-1 text-[17px] leading-snug placeholder-neutral-400 pt-2 bg-transparent"></textarea>
      </div>
      <div class="flex items-center justify-between mt-3 pt-3 border-t border-black/5">
        <span id="counter" class="text-[13px] text-neutral-400 pl-1">0 / 500</span>
        <button id="publishBtn" class="press bg-[#007AFF] text-white text-[16px] font-semibold rounded-full px-5 py-2.5 opacity-50">Опубликовать</button>
      </div>
    </div>

    <div id="feed" class="space-y-4"></div>
  </main>
</div>

<script>
(function () {
  'use strict';

  /* ---------- Хранилище ---------- */
  var K_ACC = 'tsn_accounts', K_CUR = 'tsn_current', K_POSTS = 'tsn_posts';
  var COLORS = ['#007AFF', '#34C759', '#FF9500', '#AF52DE', '#FF2D55', '#5AC8FA'];

  function load(key, fallback) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  var accounts = load(K_ACC, []);
  var currentId = null;
  try { currentId = localStorage.getItem(K_CUR); } catch (e) {}
  var posts = load(K_POSTS, null);
  var openComments = {};   // id поста -> раскрыт ли блок комментариев
  var selectedColor = COLORS[0];

  /* ---------- Стартовый контент ---------- */
  if (posts === null) {
    var now = Date.now();
    posts = [
      { id: uid(), authorId: 'demo1', name: 'Мария', initials: 'М', color: '#FF2D55',
        text: 'Утро в тишине, чашка кофе и ни одного уведомления. Кажется, это и есть настоящая роскошь ☕️',
        ts: now - 1000 * 60 * 35, likes: ['demo2', 'demo3', 'demo4'],
        comments: [
          { id: uid(), authorId: 'demo2', name: 'Артём', initials: 'А', color: '#34C759', text: 'Полностью согласен. Попробуй ещё вечерний чай — тоже работает.', ts: now - 1000 * 60 * 20 }
        ] },
      { id: uid(), authorId: 'demo2', name: 'Артём', initials: 'А', color: '#34C759',
        text: 'Закончил первую неделю изучения программирования. Сначала казалось, что ничего не понятно, а теперь собственный сайт уже открывается. Маленькие победы!',
        ts: now - 1000 * 60 * 60 * 3, likes: ['demo1', 'demo3'], comments: [] },
      { id: uid(), authorId: 'demo3', name: 'Лиза', initials: 'Л', color: '#AF52DE',
        text: 'Хороший дизайн — это когда ты не замечаешь дизайн. Всё просто работает и приятно к нему прикасаться.',
        ts: now - 1000 * 60 * 60 * 26, likes: ['demo1'],
        comments: [
          { id: uid(), authorId: 'demo1', name: 'Мария', initials: 'М', color: '#FF2D55', text: 'Запишу себе эту фразу ✨', ts: now - 1000 * 60 * 60 * 25 }
        ] }
    ];
    save(K_POSTS, posts);
  }

  /* ---------- Утилиты ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function getCurrent() {
    for (var i = 0; i < accounts.length; i++) if (accounts[i].id === currentId) return accounts[i];
    return null;
  }
  function plural(n, a, b, c) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return a;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return b;
    return c;
  }
  function timeAgo(ts) {
    var s = Math.floor((Date.now() - ts) / 1000);
    if (s < 45) return 'только что';
    var m = Math.floor(s / 60);
    if (m < 60) return (m || 1) + ' мин назад';
    var h = Math.floor(m / 60);
    if (h < 24) return h + ' ' + plural(h, 'час', 'часа', 'часов') + ' назад';
    var d = Math.floor(h / 24);
    if (d < 7) return d + ' ' + plural(d, 'день', 'дня', 'дней') + ' назад';
    return new Date(ts).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  }
  function makeInitials(name, custom) {
    var c = (custom || '').trim();
    if (c) return c.slice(0, 2).toUpperCase();
    var parts = name.trim().split(/\s+/);
    var r = parts.length > 1 ? parts[0][0] + parts[1][0] : parts[0].slice(0, 1);
    return r.toUpperCase();
  }
  function avatar(initials, color, size) {
    var cls = size === 'sm' ? 'w-8 h-8 text-[12px]' : 'w-11 h-11 text-[16px]';
    return '<div class="' + cls + ' shrink-0 rounded-full text-white font-semibold flex items-center justify-center" style="background:' + esc(color) + '">' + esc(initials) + '</div>';
  }

  /* ---------- Экраны ---------- */
  function showAuth() {
    $('app').classList.add('hidden');
    $('auth').classList.remove('hidden');
    renderExisting();
    $('nameInput').value = '';
    $('initialsInput').value = '';
    updatePreview();
  }
  function showApp() {
    $('auth').classList.add('hidden');
    $('app').classList.remove('hidden');
    var me = getCurrent();
    $('meName').textContent = me.name;
    var a = $('meAvatar'); a.textContent = me.initials; a.style.background = me.color;
    var c = $('composeAvatar'); c.textContent = me.initials; c.style.background = me.color;
    renderFeed();
  }

  function renderExisting() {
    var box = $('existing'), list = $('existingList');
    if (!accounts.length) { box.classList.add('hidden'); return; }
    box.classList.remove('hidden');
    list.innerHTML = accounts.map(function (a, i) {
      return '<button data-login="' + esc(a.id) + '" class="press w-full flex items-center gap-3 px-4 py-3 text-left' +
        (i ? ' border-t border-black/5' : '') + '">' + avatar(a.initials, a.color, 'sm') +
        '<span class="text-[17px] font-medium flex-1 truncate">' + esc(a.name) + '</span>' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C7C7CC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>';
    }).join('');
  }

  /* ---------- Регистрация ---------- */
  function renderSwatches() {
    $('swatches').innerHTML = COLORS.map(function (c) {
      return '<button type="button" data-color="' + c + '" aria-label="Цвет" class="swatch w-9 h-9 rounded-full' +
        (c === selectedColor ? ' sel' : '') + '" style="background:' + c + '"></button>';
    }).join('');
  }
  function updatePreview() {
    var name = $('nameInput').value.trim();
    var p = $('previewAvatar');
    p.style.background = selectedColor;
    p.textContent = name ? makeInitials(name, $('initialsInput').value) : '?';
    $('createBtn').style.opacity = name ? '1' : '.5';
  }

  $('swatches').addEventListener('click', function (e) {
    var b = e.target.closest('[data-color]');
    if (!b) return;
    selectedColor = b.getAttribute('data-color');
    renderSwatches(); updatePreview();
  });
  $('nameInput').addEventListener('input', updatePreview);
  $('initialsInput').addEventListener('input', updatePreview);

  $('createBtn').addEventListener('click', function () {
    var name = $('nameInput').value.trim();
    if (!name) { $('nameInput').focus(); return; }
    var acc = { id: uid(), name: name, initials: makeInitials(name, $('initialsInput').value), color: selectedColor };
    accounts.push(acc);
    save(K_ACC, accounts);
    login(acc.id);
  });
  $('existingList').addEventListener('click', function (e) {
    var b = e.target.closest('[data-login]');
    if (b) login(b.getAttribute('data-login'));
  });

  function login(id) {
    currentId = id;
    try { localStorage.setItem(K_CUR, id); } catch (e) {}
    showApp();
    window.scrollTo(0, 0);
  }
  $('logoutBtn').addEventListener('click', function () {
    currentId = null;
    try { localStorage.removeItem(K_CUR); } catch (e) {}
    showAuth();
    window.scrollTo(0, 0);
  });

  /* ---------- Публикация ---------- */
  var postInput = $('postInput');
  function updateCompose() {
    var len = postInput.value.length;
    $('counter').textContent = len + ' / 500';
    $('publishBtn').style.opacity = postInput.value.trim() ? '1' : '.5';
  }
  postInput.addEventListener('input', function () {
    postInput.style.height = 'auto';
    postInput.style.height = Math.min(postInput.scrollHeight, 200) + 'px';
    updateCompose();
  });
  $('publishBtn').addEventListener('click', function () {
    var text = postInput.value.trim();
    var me = getCurrent();
    if (!text || !me) return;
    posts.unshift({ id: uid(), authorId: me.id, name: me.name, initials: me.initials, color: me.color,
      text: text, ts: Date.now(), likes: [], comments: [] });
    save(K_POSTS, posts);
    postInput.value = ''; postInput.style.height = 'auto';
    updateCompose();
    renderFeed();
  });

  /* ---------- Лента ---------- */
  var ICON_HEART = '<svg class="heart" width="22" height="22" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
  var ICON_COMMENT = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>';
  var ICON_TRASH = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';

  function renderFeed() {
    var me = getCurrent();
    var feed = $('feed');
    if (!posts.length) {
      feed.innerHTML = '<div class="text-center text-neutral-400 text-[17px] py-16">Пока здесь пусто.<br>Опубликуйте первый пост!</div>';
      return;
    }
    feed.innerHTML = posts.map(function (p) {
      var liked = me && p.likes.indexOf(me.id) !== -1;
      var mine = me && p.authorId === me.id;
      var open = !!openComments[p.id];
      var comments = open ? commentsBlock(p) : '';
      return '<article class="card rounded-2xl p-4 fade-in" data-id="' + esc(p.id) + '">' +
        '<div class="flex items-center gap-3">' + avatar(p.initials, p.color) +
          '<div class="flex-1 min-w-0"><div class="text-[17px] font-semibold truncate">' + esc(p.name) + '</div>' +
          '<div class="text-[13px] text-neutral-400">' + esc(timeAgo(p.ts)) + '</div></div>' +
          (mine ? '<button data-act="delete" aria-label="Удалить" class="press w-10 h-10 -mr-2 rounded-full flex items-center justify-center text-neutral-400">' + ICON_TRASH + '</button>' : '') +
        '</div>' +
        '<p class="text-[17px] leading-[1.45] mt-3 whitespace-pre-wrap break-words">' + esc(p.text) + '</p>' +
        '<div class="flex items-center gap-2 mt-3 -ml-2">' +
          '<button data-act="like" class="press flex items-center gap-1.5 px-2 h-11 rounded-full text-[15px] font-medium" style="color:' + (liked ? '#FF3B30' : '#8E8E93') + '">' +
            ICON_HEART.replace('<svg class="heart"', '<svg class="heart' + (liked ? ' heart-pop' : '') + '" fill="' + (liked ? '#FF3B30' : 'none') + '" stroke="' + (liked ? '#FF3B30' : 'currentColor') + '"') +
            '<span>' + p.likes.length + '</span></button>' +
          '<button data-act="toggle" class="press flex items-center gap-1.5 px-2 h-11 rounded-full text-[15px] font-medium" style="color:' + (open ? '#007AFF' : '#8E8E93') + '">' +
            ICON_COMMENT + '<span>' + p.comments.length + '</span></button>' +
        '</div>' + comments +
      '</article>';
    }).join('');
  }

  function commentsBlock(p) {
    var list = p.comments.length
      ? p.comments.map(function (c) {
          return '<div class="flex gap-2.5">' + avatar(c.initials, c.color, 'sm') +
            '<div class="flex-1 min-w-0 bg-[#F5F5F7] rounded-2xl px-3.5 py-2.5">' +
            '<div class="flex items-baseline gap-2"><span class="text-[15px] font-semibold truncate">' + esc(c.name) + '</span>' +
            '<span class="text-[12px] text-neutral-400 shrink-0">' + esc(timeAgo(c.ts)) + '</span></div>' +
            '<p class="text-[16px] leading-snug mt-0.5 whitespace-pre-wrap break-words">' + esc(c.text) + '</p></div></div>';
        }).join('')
      : '<p class="text-[15px] text-neutral-400 text-center py-1">Комментариев пока нет</p>';
    return '<div class="mt-2 pt-3 border-t border-black/5 space-y-3">' + list +
      '<div class="flex gap-2 pt-1">' +
        '<input data-comment-input maxlength="300" autocomplete="off" placeholder="Написать комментарий…" class="flex-1 min-w-0 bg-[#F5F5F7] rounded-full px-4 py-3 text-[16px]">' +
        '<button data-act="send-comment" class="press shrink-0 bg-[#007AFF] text-white text-[15px] font-semibold rounded-full px-4">Отправить</button>' +
      '</div></div>';
  }

  function findPost(id) {
    for (var i = 0; i < posts.length; i++) if (posts[i].id === id) return posts[i];
    return null;
  }

  function sendComment(article, post) {
    var input = article.querySelector('[data-comment-input]');
    var text = input.value.trim();
    var me = getCurrent();
    if (!text || !me) { input.focus(); return; }
    post.comments.push({ id: uid(), authorId: me.id, name: me.name, initials: me.initials, color: me.color, text: text, ts: Date.now() });
    save(K_POSTS, posts);
    renderFeed();
    var again = document.querySelector('[data-id="' + post.id + '"] [data-comment-input]');
    if (again) again.focus();
  }

  $('feed').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var article = btn.closest('[data-id]');
    var post = findPost(article.getAttribute('data-id'));
    var me = getCurrent();
    if (!post || !me) return;
    var act = btn.getAttribute('data-act');

    if (act === 'like') {
      var i = post.likes.indexOf(me.id);
      if (i === -1) post.likes.push(me.id); else post.likes.splice(i, 1);
      save(K_POSTS, posts); renderFeed();
    } else if (act === 'toggle') {
      openComments[post.id] = !openComments[post.id];
      renderFeed();
    } else if (act === 'delete') {
      if (post.authorId !== me.id) return;
      if (!confirm('Удалить этот пост?')) return;
      posts = posts.filter(function (p) { return p.id !== post.id; });
      save(K_POSTS, posts); renderFeed();
    } else if (act === 'send-comment') {
      sendComment(article, post);
    }
  });
  $('feed').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.matches('[data-comment-input]')) {
      e.preventDefault();
      var article = e.target.closest('[data-id]');
      sendComment(article, findPost(article.getAttribute('da
